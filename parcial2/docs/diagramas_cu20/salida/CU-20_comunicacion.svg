<line x1="42" y1="1340" x2="1758" y2="1340" stroke="#c7d0d9"/>
<text x="50" y="1373" text-anchor="start" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#19304a">Mensajes</text>
<text x="55" y="1410" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">1. Cajero -> CajaPage: solicita sincronizacion al volver la red.</text>
<text x="55" y="1444" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">2. CajaPage -> sincronizar(): invoca sincronizar(body, scope, db).</text>
<text x="55" y="1478" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">3. sincronizar() -> OperacionLog: consulta UUID y guarda resultado confirmado.</text>
<text x="55" y="1512" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">4. sincronizar() -> Variante: valida variante vigente y precio.</text>
<text x="55" y="1546" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">5. sincronizar() -> Producto: valida producto activo y promocion.</text>
<text x="55" y="1580" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">6. sincronizar() -> Inventario: valida stock disponible con bloqueo.</text>
<text x="930" y="1410" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">7. sincronizar() -> registrar_venta(...): delega el registro de la venta.</text>
<text x="930" y="1444" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">8. registrar_venta(...) -> Venta: crea venta con UUID.</text>
<text x="930" y="1478" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">9. registrar_venta(...) -> DetalleVenta: crea detalle por variante.</text>
<text x="930" y="1512" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">10. registrar_venta(...) -> Pago: registra pago aprobado en efectivo.</text>
<text x="930" y="1546" text-anchor="start" font-family="Segoe UI,Arial" font-size="14" font-weight="normal" fill="#24384c">11. registrar_venta(...) -> Inventario: descuenta stock y registra movimiento.</text>
</svg>