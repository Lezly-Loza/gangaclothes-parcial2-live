<text x="55" y="1034" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">3.</tspan> OfflineService ? IndexedDB: guarda OperacionLocal con UUID y estado pendiente</text>
<text x="55" y="1064" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">4.</tspan> IndexedDB ? OfflineService: confirma la escritura local</text>
<text x="55" y="1094" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">5.</tspan> CajaPage ? OfflineService: sincronizarCola() al apagar el modo offline</text>
<text x="55" y="1124" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">6.</tspan> Navegador ? OfflineService: online / pesta?a visible dispara sincronizarPendientes()</text>
<text x="55" y="1154" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">7.</tspan> OfflineService ? POST /offline/sincronizar: env?a una operaci?n por solicitud</text>
<text x="55" y="1184" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">8.</tspan> Router ? sincronizacion.py: sincronizar(body, scope, db)</text>
<text x="55" y="1214" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">9.</tspan> sincronizacion.py ? OperacionLog: busca UUID; idempotencia y resultado confirmado</text>
<text x="1030" y="974" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">10.</tspan> sincronizacion.py ? Inventario: valida stock disponible con bloqueo</text>
<text x="1030" y="1004" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">11.</tspan> sincronizacion.py ? ventas.service: registrar_venta(..., UUID)</text>
<text x="1030" y="1034" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">12.</tspan> sincronizacion.py ? Router: responde c?digo de venta y estado confirmado</text>
<text x="1030" y="1064" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">13.</tspan> Router ? OfflineService: resultado HTTP 200 o conflicto 403/409/422</text>
<text x="1030" y="1094" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">14.</tspan> ventas.service ? Venta: crea la venta con UUID</text>
<text x="1030" y="1124" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">15.</tspan> ventas.service ? DetalleVenta: crea el detalle de la venta</text>
<text x="1030" y="1154" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">16.</tspan> ventas.service ? Pago: registra el pago en efectivo aprobado</text>
<text x="1030" y="1184" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">17.</tspan> ventas.service ? Inventario: descuenta stock y registra movimiento</text>
<text x="1030" y="1214" font-family="Segoe UI,Arial" font-size="15" fill="#23374d"><tspan font-weight="700">18.</tspan> OfflineService ? CajaPage: actualiza estado y notifica; error de red conserva pendiente</text>
